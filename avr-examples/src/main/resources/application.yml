server:
  address: ${AVR_SERVER_ADDRESS:127.0.0.1}

avr:
  llm:
    openai:
      api-url: ${AVR_API_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY}
      model: ${AVR_MODEL:gpt-4.1-mini}
      stream: true
      temperature: 0.1
      timeout: 5m
      max-retries: ${AVR_MODEL_MAX_RETRIES:2}
      headers: {}
  agent:
    name: stock-report-agent
    max-steps: 30
    max-step-multiplier: 3
    loop-timeout: 90m
    tool-timeout: 2m
    skill-name: fundamental-stock-analysis
    instructions: |
      You are a cautious equity research analyst.
      Use only facts contained in the supplied stock-data file.
      Calculate growth, margin, cash-flow, leverage and valuation ratios.
      Separate observed facts from interpretation and never invent missing data.
      Include profitability, valuation, catalysts, risks, and bull/base/bear cases.
      Create /report/report.html and commit /report with /report.html as entrypoint.
      State that the report is educational and is not investment advice.
  workspace:
    type: disk
    id: stock-report-example
    path: ${AVR_WORKSPACE_DIR:./avr-examples/target/stock-agent-workspace}
  chat:
    web-search-enabled: ${AVR_WEB_SEARCH_ENABLED:true}
    models:
      - id: ${AVR_MODEL:gpt-4.1-mini}
        name: ${AVR_MODEL_DISPLAY_NAME:Primary model}
        web-search: ${AVR_MODEL_WEB_SEARCH_MODE:runtime}
    workspace:
      type: ${AVR_CHAT_WORKSPACE_TYPE:disk}
      root: ${AVR_CHAT_WORKSPACE_ROOT:./avr-examples/target/chat-workspaces}
