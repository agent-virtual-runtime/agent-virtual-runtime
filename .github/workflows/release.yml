name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: maven-central-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: GPG_PASSPHRASE

      - name: Check tag and project version
        shell: bash
        run: |
          VERSION="$(mvn --batch-mode --no-transfer-progress -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Maven version ${VERSION}" >&2
            exit 1
          fi

      - name: Verify all modules
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload release bundle for manual publishing
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        shell: bash
        run: |
          if [[ -z "${CENTRAL_USERNAME}" || -z "${CENTRAL_PASSWORD}" || -z "${GPG_PASSPHRASE}" ]]; then
            echo "Maven Central credentials or GPG passphrase are not configured" >&2
            exit 1
          fi
          mvn --batch-mode --no-transfer-progress -Pcentral-release -pl '!avr-examples' deploy
